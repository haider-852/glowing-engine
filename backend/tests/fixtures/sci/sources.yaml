# Judgment PDFs from the Supreme Court of India's website, extracted with
# `pdftotext -layout` (poppler 24.02). `scripts/fetch_sci_samples.py`
# re-downloads them and rewrites the .txt files; another poppler version may
# lay the text out differently, so run tests/test_sci.py after re-extracting.
#
# Source: Supreme Court of India, www.sci.gov.in. The site's copyright policy
# allows reproduction with the source acknowledged; these files are test
# fixtures, not a redistribution of the judgments.
#
# Two kinds of PDF, both linked from the website:
# * judis: https://api.sci.gov.in/jonew/judis/<n>.pdf, the archive the old
#   site's judgment search linked to. Up to about 2009 these are JUDIS text
#   (the SCR report's text, keyed in); from about 2010 the signed judgment.
# * signed: https://www.sci.gov.in/sci-get-pdf/?diary_no=<diary number and
#   year>&type=j&order_date=<date>&from=latest_judgements_order, the link
#   behind "View Judgment" on www.sci.gov.in. Without `from` the site answers
#   with an HTML page ("Invalid details").
#
# The site's search forms need a CAPTCHA, so these were found without them:
# the 2026 judgments from the home page's "Latest Judgments" list and the
# "Landmark Judgment Summaries" page, the older ones by trying JUDIS numbers.
# Neutral citations and SCR citations for the older ones come from the Digital
# SCR mirror's metadata (see ../scr/sources.yaml), matched on title and date.

judgments:
