    neutral: 1954 INSC 78
    decided: "1954-05-28"
    bench: Mahajan C.J., S.R. Das, Bose, Bhagwati and Venkatarama Aiyar JJ.
    why: "JUDIS text of a 1954 Constitution Bench: \"MEHR CHAND MAHAJAN C.J.-The\" with no comma; statutory text quoted at length; \"Writ issued,\" as the disposal."
